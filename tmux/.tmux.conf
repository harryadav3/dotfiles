set -g default-terminal "screen-256color"
set-option -g default-shell /usr/bin/zsh

# Set the prefix key to C-o
#set -g prefix C-o
set -g prefix C-a
unbind C-b
bind C-o send-prefix

unbind %
bind / split-window -h
unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind-key x kill-pane

# Use prefix + J/K/L/H (capital) for resizing
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r H resize-pane -L 5

#for allowing to pass the copied material from vim to above layer
set -g allow-passthrough on
set -g set-clipboard on

set -g mouse on
set-window-option -g mode-keys vi
set -s escape-time 0
set -g base-index 1

bind-key -T copy-mode-vi 'v' send -X begin-selection
unbind -T copy-mode-vi MouseDragEnd1Pane
# y copies selection to system clipboard via OSC 52 (works over SSH)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "printf '\033]52;c;%s\a' \"$(base64)\""


# Tmux plugins
set -g @plugin 'tmux-plugins/tpm'
# REMOVED: 'christoomey/vim-tmux-navigator' — we handle it manually below

# Theme
set -g @plugin 'jimeh/tmux-themepack'
set -g @themepack 'powerline/block/cyan'

# Smart pane switching — aware of Vim AND SSH
is_vim_or_ssh="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf|ssh)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim_or_ssh" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim_or_ssh" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim_or_ssh" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim_or_ssh" 'send-keys C-l' 'select-pane -R'

run '~/.tmux/plugins/tpm/tpm'
set -g status-justify left
