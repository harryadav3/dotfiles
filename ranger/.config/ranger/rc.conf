# Ranger configuration file
# For full documentation of the options in this file, see the ranger man page.

# How many columns are there, and what are their relative widths?
set column_ratios 1,3,4

# Which files should be hidden? (regular expression)
set hidden_filter ^\.|\.(?:pyc|pyo|bak|swp)$|^lost\+found$|^__(py)?cache__$

# Show hidden files? You can toggle this by typing 'zh'
set show_hidden false

# Ask for a confirmation when running the "delete" command?
set confirm_on_delete always

# Use non-default path for file preview script?
set preview_script ~/.config/ranger/scope.sh

# Use the external preview script or display simple plain text or image previews?
set use_preview_script true

# Be aware of version control systems and display information
set vcs_aware true
set vcs_backend_git enabled
set vcs_backend_hg disabled
set vcs_backend_bzr disabled
set vcs_backend_svn disabled

# Use one of the supported image preview protocols
set preview_images true
set preview_images_method w3m

# Default sorting order
set sort natural
set sort_directories_first true
set sort_unicode true

# Show hostname in titlebar
set hostname_in_titlebar true

# Enable this if key combinations with the Alt Key don't work for you.
set xterm_alt_key false

# Use a unicode "..." character to mark cut-off filenames?
set unicode_ellipsis true

# Custom keybindings
map <Space> quickLook
map e mark_files toggle=True

# Directory shortcuts
map gd cd ~/Downloads
map gh cd ~
map gp cd ~/projects
map gc cd ~/coding
map gv cd /Volumes
map gn cd ~/notes

# File operations
map cw console rename%space
map cd console mkdir%space
map cf console touch%space

# Compression and extraction
map zz compress
map ez extract

# Tab management
map tn     tab_new ~
map tc     tab_close
map td     tab_close
map t1     tab_open 1
map t2     tab_open 2
map t3     tab_open 3
map t4     tab_open 4
map t5     tab_open 5
map t6     tab_open 6
map t7     tab_open 7
map t8     tab_open 8
map t9     tab_open 9

# Search
map /  console search%space
map n  search_next
map N  search_next forward=False

# FZF integration
map f fzf_select

# Open with external editor
map E  shell $EDITOR %f
map O  shell $EDITOR .

# Trash command instead of permanent delete
map DD trash
map dt trash
